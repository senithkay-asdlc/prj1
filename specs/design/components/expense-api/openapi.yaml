openapi: 3.0.3
info:
  title: Expense API
  version: 0.1.0
  description: Expense claim submission, manager approval, and finance export to payroll.
servers:
  - url: /

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    UserId:
      name: X-User-Id
      in: header
      required: true
      description: caller identity injected by the gateway from the validated token
      schema: { type: string }
    ClaimId:
      name: claimId
      in: path
      required: true
      description: expense claim identifier
      schema: { type: string }
  schemas:
    ExpenseCategory:
      type: string
      enum: [Travel, Meals, Lodging, Supplies, Other]
    ExpenseStatus:
      type: string
      enum: [submitted, approved, rejected, exported]
    ExpenseClaim:
      type: object
      required: [id, employeeId, category, amount, currency, expenseDate, status]
      properties:
        id: { type: string }
        employeeId: { type: string }
        category: { $ref: '#/components/schemas/ExpenseCategory' }
        amount: { type: number, format: double }
        currency: { type: string, description: organization-wide currency code }
        expenseDate: { type: string, format: date }
        description: { type: string }
        receiptUrl: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/ExpenseStatus' }
        rejectionReason: { type: string, nullable: true }
        submittedAt: { type: string, format: date-time }
        decidedAt: { type: string, format: date-time, nullable: true }
        exportedAt: { type: string, format: date-time, nullable: true }
    ExpenseClaimInput:
      type: object
      required: [category, amount, currency, expenseDate, description]
      properties:
        category: { $ref: '#/components/schemas/ExpenseCategory' }
        amount: { type: number, format: double }
        currency: { type: string }
        expenseDate: { type: string, format: date }
        description: { type: string }
    RejectionInput:
      type: object
      required: [reason]
      properties:
        reason: { type: string }
    ExportRequest:
      type: object
      required: [claimIds]
      properties:
        claimIds:
          type: array
          items: { type: string }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: integer, description: HTTP or application error code }
        message: { type: string, description: short human-readable label }
        description: { type: string, description: detailed explanation }
        moreInfo: { type: string, description: URI to documentation }

security:
  - bearerAuth: []

paths:
  /expense-claims:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      operationId: listExpenseClaims
      summary: List expense claims visible to the caller's role
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ExpenseStatus' }
        - name: employeeId
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        '200':
          description: matching expense claims
          content:
            application/json:
              schema:
                type: object
                required: [count, data]
                properties:
                  count: { type: integer, description: total matching items }
                  next: { type: string, nullable: true, description: relative URI of the next page }
                  previous: { type: string, nullable: true, description: relative URI of the previous page }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ExpenseClaim' }
        '401':
          description: caller is not authenticated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      operationId: submitExpenseClaim
      summary: Submit a new expense claim
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExpenseClaimInput' }
      responses:
        '201':
          description: claim created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExpenseClaim' }
        '400':
          description: invalid claim data
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: caller is not authenticated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /expense-claims/{claimId}:
    parameters:
      - $ref: '#/components/parameters/ClaimId'
      - $ref: '#/components/parameters/UserId'
    get:
      operationId: getExpenseClaim
      summary: Get one expense claim
      responses:
        '200':
          description: the claim
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExpenseClaim' }
        '401':
          description: caller is not authenticated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: caller may not view this claim
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: claim not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /expense-claims/{claimId}/receipt:
    parameters:
      - $ref: '#/components/parameters/ClaimId'
      - $ref: '#/components/parameters/UserId'
    post:
      operationId: uploadExpenseClaimReceipt
      summary: Attach a receipt file to a claim
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200':
          description: receipt attached
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExpenseClaim' }
        '400':
          description: invalid file
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: claim not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /expense-claims/{claimId}/resubmit:
    parameters:
      - $ref: '#/components/parameters/ClaimId'
      - $ref: '#/components/parameters/UserId'
    post:
      operationId: resubmitExpenseClaim
      summary: Resubmit a corrected, previously rejected claim
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExpenseClaimInput' }
      responses:
        '200':
          description: claim resubmitted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExpenseClaim' }
        '400':
          description: claim is not in a rejected state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: claim not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /expense-claims/{claimId}/approve:
    parameters:
      - $ref: '#/components/parameters/ClaimId'
      - $ref: '#/components/parameters/UserId'
    post:
      operationId: approveExpenseClaim
      summary: Approve a pending expense claim
      responses:
        '200':
          description: claim approved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExpenseClaim' }
        '403':
          description: caller is not the claim's manager
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: claim not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /expense-claims/{claimId}/reject:
    parameters:
      - $ref: '#/components/parameters/ClaimId'
      - $ref: '#/components/parameters/UserId'
    post:
      operationId: rejectExpenseClaim
      summary: Reject a pending expense claim with a reason
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RejectionInput' }
      responses:
        '200':
          description: claim rejected
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExpenseClaim' }
        '400':
          description: reason is required
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: caller is not the claim's manager
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: claim not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /expense-claims/export:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      operationId: exportExpenseClaims
      summary: Export approved, unexported claims to a payroll-ready file and mark them exported
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExportRequest' }
      responses:
        '200':
          description: exported claims as a downloadable CSV file
          content:
            text/csv:
              schema: { type: string }
        '400':
          description: one or more claims are not in approved status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: caller is not Finance
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
